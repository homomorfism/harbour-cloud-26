spring.application.name=cloud

# ---------------------------------------------------------------------------
# Async processing
# ---------------------------------------------------------------------------
# How often the background worker scans for pending payments to process.
payments.worker.interval-ms=1000
# Simulated remote-system call latency (ms) - bump up to make async visible.
payments.remote.latency-ms=0

# ---------------------------------------------------------------------------
# Sharding configuration
#
# The payments table is sharded across N independent Postgres instances.
# The number of shards is static: it is simply the number of entries below.
# To change the shard count, add/remove a payments.sharding.shards[i] block
# (and a matching service in compose.yaml). No resharding logic is provided.
#
# Shard selection: shardIndex = hash(paymentId) % shardCount  (see ShardRouter).
# ---------------------------------------------------------------------------
# Host ports are 15432/15433/15434 (see compose.yaml) to avoid clashing with
# other local Postgres containers. When the app itself runs inside compose it
# uses the "docker" profile instead, which targets the shardN service names.
payments.sharding.shards[0].url=jdbc:postgresql://localhost:15432/payments
payments.sharding.shards[0].username=payments
payments.sharding.shards[0].password=payments

payments.sharding.shards[1].url=jdbc:postgresql://localhost:15433/payments
payments.sharding.shards[1].username=payments
payments.sharding.shards[1].password=payments

payments.sharding.shards[2].url=jdbc:postgresql://localhost:15434/payments
payments.sharding.shards[2].username=payments
payments.sharding.shards[2].password=payments
