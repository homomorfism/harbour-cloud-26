# Active when SPRING_PROFILES_ACTIVE=docker (set in the Dockerfile / app service).
# Inside the compose network the shards are reachable by service name on the
# internal port 5432 - not via the host-published 15432/15433/15434 ports.
#
# NOTE: Spring binds a list from a single property source (it does not merge list
# entries across files), so each shard must be fully specified here, not just the
# url - otherwise username/password from application.properties would be dropped.
payments.sharding.shards[0].url=jdbc:postgresql://shard0:5432/payments
payments.sharding.shards[0].username=payments
payments.sharding.shards[0].password=payments

payments.sharding.shards[1].url=jdbc:postgresql://shard1:5432/payments
payments.sharding.shards[1].username=payments
payments.sharding.shards[1].password=payments

payments.sharding.shards[2].url=jdbc:postgresql://shard2:5432/payments
payments.sharding.shards[2].username=payments
payments.sharding.shards[2].password=payments
