spring.application.name=cloud

# Tests use three in-memory H2 databases as stand-in shards. This exercises the
# exact same ShardRouter + sharded repository code path as production, but with
# no Docker/Postgres required. Each shard is a distinct named in-mem database.
payments.sharding.shards[0].url=jdbc:h2:mem:shard0;DB_CLOSE_DELAY=-1
payments.sharding.shards[0].username=sa
payments.sharding.shards[0].password=

payments.sharding.shards[1].url=jdbc:h2:mem:shard1;DB_CLOSE_DELAY=-1
payments.sharding.shards[1].username=sa
payments.sharding.shards[1].password=

payments.sharding.shards[2].url=jdbc:h2:mem:shard2;DB_CLOSE_DELAY=-1
payments.sharding.shards[2].username=sa
payments.sharding.shards[2].password=
